<table class="table table-striped"><thead><tr><th>ID</th><th>Название</th><th>Статус</th><th>Приоритет</th><th>Автор</th><th>Исполнитель</th></tr></thead><tbody>
{% for item in incidents %}<tr><td>{{ item.id }}</td><td><a href="{% url 'web_incidents:incident_detail' item.id %}">{{ item.title }}</a></td><td>{{ item.status }}</td><td>{{ item.priority }}</td><td>{{ item.user.name }}</td><td>{{ item.executor.name|default:'Не назначен' }}</td></tr>
{% empty %}<tr><td colspan="6">Записи не найдены</td></tr>{% endfor %}</tbody></table>
